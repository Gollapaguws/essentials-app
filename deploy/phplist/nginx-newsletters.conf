# phpList — newsletters.essentialsedm.com
# Install at /etc/nginx/sites-available/newsletters.essentialsedm.com and
# symlink into sites-enabled. TLS is issued with:
#   certbot certonly --webroot -w /var/www/letsencrypt -d newsletters.essentialsedm.com
# Port 443 on this host is terminated by the nginx stream router in
# /etc/nginx/stream-conf.d/essentials.conf, which forwards TLS to 127.0.0.1:8443.
# So this vhost listens on 8443 like the other HTTPS sites on the host.

server {
    listen 80;
    listen [::]:80;
    server_name newsletters.essentialsedm.com;

    # certbot's HTTP-01 challenge, and nothing else unencrypted.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name newsletters.essentialsedm.com;

    ssl_certificate /etc/letsencrypt/live/newsletters.essentialsedm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newsletters.essentialsedm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Campaign images and imported lists can be large; phpList's PHP limits are
    # 50M per file / 100M per request in the image's Apache vhost.
    client_max_body_size 100m;

    # Admin session cookies are set over HTTPS only; the container has no idea
    # the request was TLS, so tell phpList through the forwarded header.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}
