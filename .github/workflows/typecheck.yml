name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck (api, web, mobile, site)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # `prisma generate` only parses the schema; no database is contacted.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The API and web typecheck against the generated Prisma types and the
      # built workspace packages, so those have to exist before tsc runs.
      - name: Generate Prisma client
        run: npm run generate --workspace @essentials/db

      - name: Build shared packages
        run: |
          npm run build --workspace @essentials/db
          npm run build --workspace @essentials/api-client

      - name: Typecheck API
        working-directory: apps/api
        run: npx tsc --noEmit -p tsconfig.json

      - name: Typecheck web
        working-directory: apps/web
        run: npx tsc --noEmit -p tsconfig.json

      - name: Typecheck mobile
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Typecheck site
        working-directory: apps/site
        run: npm run typecheck

      - name: Lint API
        working-directory: apps/api
        run: npm run lint

      - name: Lint web
        working-directory: apps/web
        run: npm run lint

      - name: Lint mobile
        working-directory: apps/mobile
        run: npm run lint

      - name: Lint site
        working-directory: apps/site
        run: npm run lint

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The suite mocks Prisma and GoTrue, so these values only have to parse.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: test-anon-key
      SESSION_SECRET: test-session-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Specs import @essentials/db, which needs a generated client to load.
      - name: Generate Prisma client and build shared packages
        run: |
          npm run generate --workspace @essentials/db
          npm run build --workspace @essentials/db
          npm run build --workspace @essentials/api-client

      - name: Run tests
        working-directory: apps/api
        run: npx jest --ci

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client and build shared packages
        run: |
          npm run generate --workspace @essentials/db
          npm run build --workspace @essentials/db
          npm run build --workspace @essentials/api-client

      # The Supabase client is created at module scope, so `next build` cannot
      # prerender a single page without these. Fork PRs get no secrets, hence
      # the guard rather than a failing build.
      - name: Check Supabase secrets
        id: supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY are not set, so the web build was skipped."
          fi

      - name: Build web
        if: steps.supabase.outputs.available == 'true'
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build
