<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>ESSENTIALS — Offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      .card {
        max-width: 420px;
        padding: 32px;
        border: 1px solid #2a2a2a;
        border-radius: 20px;
        background: #141414;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border: 2px solid #00ff66;
        border-radius: 16px;
        color: #00ff66;
        font-size: 32px;
        font-weight: 900;
      }
      h1 { margin: 0 0 10px; font-size: 22px; letter-spacing: 0.08em; }
      p { margin: 0 0 22px; color: #9a9a9a; line-height: 1.55; }
      a {
        display: inline-block;
        padding: 13px 20px;
        border-radius: 10px;
        background: #00ff66;
        color: #0a0a0a;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">E</div>
      <h1>NO SIGNAL</h1>
      <p>ESSENTIALS is offline right now. Reconnect, then try again — your events and passes will be waiting.</p>
      <a href="/">RETRY</a>
    </main>
  </body>
</html>
