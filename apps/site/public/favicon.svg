<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="SONUS">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#1b2f57"/>
      <stop offset="55%" stop-color="#0a1327"/>
      <stop offset="100%" stop-color="#04060d"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Small cut of the orbital mark: one orbit ring instead of two, or the
       strokes merge into a blob at 16-32px in a tab. -->
  <g transform="translate(32 32)" fill="none">
    <circle r="15" stroke="#eaf6ff" stroke-width="3.2" stroke-opacity="0.96"/>
    <ellipse rx="25" ry="8.6" transform="rotate(-20)" stroke="#9fd8ff" stroke-width="2.6" stroke-opacity="0.95"/>
    <circle r="3.8" fill="#eaf6ff" stroke="none"/>
  </g>
</svg>
